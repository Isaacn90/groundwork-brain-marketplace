name: Feature request
description: Something new or changed. Claude builds it and opens a PR for you to approve.
title: "[Feature] "
labels: ["feature", "claude"]
body:
  - type: markdown
    attributes:
      value: |
        Claude picks this up as soon as it's filed, builds it on a branch and opens a PR.
        Reply `approve` on the PR or here when you're happy. It merges and ships.
        The clearer the "done when" list, the less back and forth.
  - type: textarea
    id: what
    attributes:
      label: What should it do?
      description: Describe the change from the user's side.
      placeholder: "Add a filter on the board so I only see tickets for one project."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: Who it's for and what problem it fixes. Helps Claude make the right calls on details.
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: One line per check. Claude treats these as the acceptance criteria and reports against each one in the PR.
      placeholder: |
        - A project dropdown sits above the lanes
        - Picking a project hides every other project's tickets
        - The choice survives a page reload
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: Anything Claude should not touch.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Normal
        - High
        - Low
      default: 0
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: Links, screenshots, examples
    validations:
      required: false
