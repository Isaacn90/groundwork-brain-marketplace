# gw-tickets: creates the labels the ticket flow depends on. The issue forms
# apply `claude`, and GitHub silently drops a label that does not exist, so
# this runs whenever the ticket workflows land on the default branch.

name: Ticket labels

on:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/claude-*.yml
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh label create claude     --force --color 7C3AED --description "Claude builds this ticket"
          gh label create feature    --force --color 0E8A16 --description "New or changed behaviour"
          gh label create bug        --force --color D73A4A --description "Something is broken"
          gh label create refined    --force --color 5319E7 --description "Spec posted; reply to change it, or go to build"
          gh label create needs-info --force --color FBCA04 --description "Claude asked questions; your reply updates the spec"
          gh label create shipped    --force --color 1D76DB --description "Merged and deployed"
